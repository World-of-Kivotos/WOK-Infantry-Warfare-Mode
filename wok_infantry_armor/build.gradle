plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
    id 'java'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-${mc_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: mc_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.parchmentmc.org/' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_full_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${mc_version}:${geckolib_version}")

    // TaCZ remains an optional runtime integration and is never bundled.
    // Development uses an explicitly supplied or ForgeGradle-mapped local jar.
    def taczJar = file(providers.gradleProperty('tacz_dev_jar_path')
            .orElse("${System.getProperty('user.home')}/.gradle/caches/forge_gradle/deobf_dependencies/local/tacz-1.20.1/1.1.8-hotfix_mapped_official_1.20.1/tacz-1.20.1-1.1.8-hotfix_mapped_official_1.20.1.jar")
            .get())
    if (taczJar.exists()) {
        implementation files(taczJar)
    } else {
        throw new GradleException("Mapped TaCZ development jar not found at ${taczJar}; set -Ptacz_dev_jar_path=<path>")
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
