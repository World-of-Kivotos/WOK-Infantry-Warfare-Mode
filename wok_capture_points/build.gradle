plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def infantryProperties = new Properties()
file('../wok_infantry/gradle.properties').withInputStream { infantryProperties.load(it) }
def infantryVersion = infantryProperties.getProperty('mod_version')
def infantryJar = file(providers.gradleProperty('infantry_dev_jar_path')
        .getOrElse("../wok_infantry/build/libs/wok_infantry-${infantryVersion}.jar"))
if (!infantryJar.exists()) {
    throw new GradleException("WOK Infantry development JAR not found at ${infantryJar}; build ../wok_infantry first")
}
def infantryArtifact = infantryJar.name.replaceFirst(/^wok_infantry-/, '').replaceFirst(/\.jar$/, '')
File uiTestWorkingDirectory = project.file('../wok_infantry/run/ui-test').canonicalFile
File uiTestResultFile = new File(uiTestWorkingDirectory,
        'ui-test-results/wok_capture_points_ui_acceptance.txt').canonicalFile
File uiSelectorFallbackDir = new File(uiTestWorkingDirectory,
        '.selector-tcp-fallback/not-created').canonicalFile

sourceSets {
    uiTest {
        java.srcDir 'src/uiTest/java'
        resources.srcDir 'src/uiTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        uiTestClient {
            parent runs.client
            workingDirectory uiTestWorkingDirectory
            singleInstance true
            jvmArgs "-Djdk.net.unixdomain.tmpdir=${uiSelectorFallbackDir.absolutePath}"
            args '--quickPlaySingleplayer', 'wok_ui_test', '--width', '960', '--height', '720'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.uiTest
                }
            }
        }
        server { args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', mod_id }
    }
}

repositories {
    mavenCentral()
    flatDir { dirs infantryJar.parentFile }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly(fg.deobf("local:wok_infantry:${infantryArtifact}")) { transitive = false }
    uiTestRuntimeOnly(fg.deobf("local:wok_infantry:${infantryArtifact}")) { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('test', Test).configure { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.matching { it.name == 'runUiTestClient' }.configureEach {
    doFirst {
        File expectedRoot = project.file('../wok_infantry/run/ui-test').canonicalFile
        if (!uiTestResultFile.toPath().startsWith(expectedRoot.toPath())) {
            throw new GradleException("Refusing to manage unexpected UI result path: ${uiTestResultFile}")
        }
        if (uiTestResultFile.exists() && !uiTestResultFile.delete()) {
            throw new GradleException("Could not remove stale UI result: ${uiTestResultFile}")
        }
    }
    doLast {
        if (!uiTestResultFile.isFile()) {
            throw new GradleException("Capture-point UI harness did not write ${uiTestResultFile}")
        }
        List<String> lines = uiTestResultFile.readLines('UTF-8')
        if (lines.isEmpty() || lines.first() != 'PASS') {
            throw new GradleException("Capture-point UI acceptance failed: ${lines}")
        }
    }
}
